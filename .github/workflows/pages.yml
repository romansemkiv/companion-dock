# The browser installer on GitHub Pages: installer/ (the page and esptool-js) with firmware/ (the release files it
# flashes, latest.json first) as one site. Runs on every push to main that touches either, or by hand.
name: Installer site

on:
  push:
    branches: [main]
    paths: ["installer/**", "firmware/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R installer/. _site/
          cp -R firmware _site/firmware
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
