<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Companion Box</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234cc2ff'/%3E%3Cg fill='%2304131c'%3E%3Ccircle cx='6' cy='6' r='2.4'/%3E%3Ccircle cx='12' cy='6' r='2.4'/%3E%3Ccircle cx='18' cy='6' r='2.4'/%3E%3Ccircle cx='6' cy='12' r='2.4'/%3E%3Ccircle cx='12' cy='12' r='2.4'/%3E%3Ccircle cx='18' cy='12' r='2.4'/%3E%3Ccircle cx='6' cy='18' r='2.4'/%3E%3Ccircle cx='12' cy='18' r='2.4'/%3E%3Ccircle cx='18' cy='18' r='2.4'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Tokens, shell and components (dark first, light under
   prefers-color-scheme or data-theme=light). */
:root{
  --bg:#0b0e12;--panel:#11161c;--panel2:#161d25;--line:#1e2731;--line2:#2b3644;
  --fg:#e6edf3;--mut:#8b98a8;--dim:#7a8796;--field-line:#617086;
  --acc:#4cc2ff;--acc-ink:#04131c;--acc-soft:rgba(76,194,255,.12);
  --ok:#3ddc84;--ok-soft:rgba(61,220,132,.13);--warn:#f5b942;--warn-soft:rgba(245,185,66,.14);--bad:#ff5d6c;--bad-soft:rgba(255,93,108,.13);--bad-ink:#1a0306;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color-scheme:dark;
  --bar-h:60px;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f3f5f8;--panel:#fff;--panel2:#f6f8fb;--line:#e3e8ee;--line2:#d3dae3;--fg:#0f1720;--mut:#5b6878;--dim:#647080;--field-line:#7a8594;--knob-ring:#7a8594;
  --acc:#0067b0;--acc-ink:#fff;--acc-soft:rgba(10,132,214,.09);--ok:#0a7340;--ok-soft:rgba(19,154,85,.1);--warn:#8a5a00;--warn-soft:rgba(183,121,31,.1);
  --bad:#b3202f;--bad-soft:rgba(214,52,71,.09);--bad-ink:#fff;--shadow:0 1px 2px rgba(15,23,32,.04),0 6px 18px rgba(15,23,32,.05);color-scheme:light}}
:root[data-theme=light]{
  --bg:#f3f5f8;--panel:#fff;--panel2:#f6f8fb;--line:#e3e8ee;--line2:#d3dae3;--fg:#0f1720;--mut:#5b6878;--dim:#647080;--field-line:#7a8594;--knob-ring:#7a8594;
  --acc:#0067b0;--acc-ink:#fff;--acc-soft:rgba(10,132,214,.09);--ok:#0a7340;--ok-soft:rgba(19,154,85,.1);--warn:#8a5a00;--warn-soft:rgba(183,121,31,.1);
  --bad:#b3202f;--bad-soft:rgba(214,52,71,.09);--bad-ink:#fff;--shadow:0 1px 2px rgba(15,23,32,.04),0 6px 18px rgba(15,23,32,.05);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:.92em;font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.off{opacity:.5}
.ic{width:18px;height:18px;flex:none;fill:currentColor;vertical-align:middle}
.ic.sm{width:15px;height:15px}.ic.lg{width:22px;height:22px}

/* shell */
#app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;min-height:100dvh}
#side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px}
.logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);border:1px solid var(--line2);flex:none}
.brand b{display:block;font-size:14px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.brand small{display:block;font:11px var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
nav{padding:4px 10px 12px;flex:1}
nav .grp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:16px 8px 6px}
nav a{display:flex;gap:10px;align-items:center;padding:7px 10px;margin:1px 0;border-radius:8px;color:var(--mut);font-weight:500}
nav a:hover{background:var(--panel2);color:var(--fg);text-decoration:none}
nav a.on{background:var(--acc-soft);color:var(--acc)}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--dim)}
.side-foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{min-width:0;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;min-height:var(--bar-h);padding:8px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-size:17px;font-weight:600;display:flex;gap:10px;align-items:center;letter-spacing:-.005em;white-space:nowrap}
.chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font:11.5px var(--mono);color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
/* the network signs; the route's at full ink with an accent edge; crossed: one shared slash, grey or red */
.sg{position:relative;color:var(--mut)}.sg:hover{text-decoration:none;border-color:var(--line2)}.sg.rt{color:var(--fg);border-color:var(--acc)}
.sg.x .ic{color:var(--dim)}.sg.x:before{content:'';position:absolute;left:8px;top:12px;width:19px;height:2px;background:var(--dim);box-shadow:0 0 0 1.5px var(--panel);transform:rotate(-45deg)}.sg.bad:before{background:var(--bad)}
.dot.acc{background:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}.dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
#menu{display:none}
#scrim{display:none}
.wrap{padding:24px 28px 48px;max-width:1240px;width:100%}
#view,.wrap,.panel,.pb{min-width:0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);border-top-color:currentColor;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.scanst{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:0 0 14px;overflow-wrap:anywhere}
.nets{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px;max-height:300px;overflow:auto}
.net{width:100%;height:auto;min-height:38px;padding:7px 12px;justify-content:flex-start;gap:10px;text-align:left;background:var(--panel);color:var(--fg);border-color:var(--line);font-weight:500}
.net:hover,.net:focus-visible{background:var(--acc-soft);border-color:var(--acc);filter:none}
.net .nm{flex:1;min-width:0;white-space:normal;overflow-wrap:anywhere}
.net small{color:var(--mut);font:11.5px var(--mono)}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px;flex:none}
.bars i{width:3px;border-radius:1px;background:var(--line2)}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:14px}
.bars.b1 i:nth-child(-n+1),.bars.b2 i:nth-child(-n+2),.bars.b3 i:nth-child(-n+3),.bars.b4 i{background:var(--acc)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:16px}
.panel>.ph{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;min-height:48px;padding:6px 16px;border-bottom:1px solid var(--line)}
.panel>.ph h2{margin:0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);display:flex;align-items:center;gap:8px}
.panel>.ph .act{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;align-items:center;min-width:0}
.panel>.pb{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-bottom:16px}
.grid>.panel{margin-bottom:0}
.note{color:var(--mut);font-size:13px;margin:0 0 12px}
.note code{color:var(--fg)}
/* Home: the signal chain Network → Companion → Decks, a chevron on each divider; stacked on a phone */
.chain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.hop{position:relative;min-width:0;padding:14px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.hop+.hop{border-left:1px solid var(--line)}
.hop+.hop:before{content:"";position:absolute;left:-6px;top:50%;width:9px;height:9px;margin-top:-5px;border:solid var(--line2);border-width:1.5px 1.5px 0 0;background:var(--panel);transform:rotate(45deg)}
.hop .lbl{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.hop .val{font:600 16px/1.25 var(--mono);margin-top:4px;display:flex;align-items:center;gap:9px}
.hop .sub{font-size:12px;color:var(--dim);font-family:var(--mono);overflow-wrap:anywhere;max-width:100%}
.hop button{margin-top:8px}
.ready{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;margin-bottom:16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.ready b{font-size:17px;font-weight:600}.ready span{color:var(--mut);font-size:13.5px}.ready .dot{width:9px;height:9px}
.probs{border-top:1px solid var(--line);padding:10px 16px;font-size:13px}.probs summary{cursor:pointer;color:var(--mut)}.probs .plist{margin-top:10px}
.ferr{display:block;color:var(--bad);font-size:12.5px;margin-top:5px}[aria-invalid=true],[aria-invalid=true]:focus{border-color:var(--bad)}.unsaved{color:var(--warn);font-size:12.5px}
.pb h3{margin:0 0 6px;font-size:13.5px;font-weight:600}.pb .sep{border-top:1px solid var(--line);margin:18px -16px 16px}
.bn.setup,.bn.bw{flex-wrap:wrap}.bn.setup>span,.bn.bw>span{flex:1 1 220px}.bn.setup b{display:block;font-size:15px;margin-bottom:2px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;font-size:13.5px;margin:0}.kv:not(:last-child){margin-bottom:12px}
.kvw:not(:empty){margin-bottom:14px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}

/* forms */
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;height:36px;padding:0 11px;border:1px solid var(--field-line);border-radius:8px;background:var(--panel2);color:var(--fg);font:13.5px var(--sans);transition:border-color .15s,box-shadow .15s}
input[type=number],input.mono{font-family:var(--mono)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea{height:auto;min-height:84px;padding:9px 11px;resize:vertical;line-height:1.5}
input[type=file]{height:auto;padding:8px}
input[type=file]::file-selector-button{height:28px;margin-right:10px;padding:0 10px;border:1px solid var(--field-line);border-radius:6px;background:transparent;color:var(--fg);font:600 12.5px var(--sans);cursor:pointer}
.sw{display:flex;align-items:center;gap:10px;margin:2px 0 14px;cursor:pointer;user-select:none;font-size:13.5px}
.sw input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--field-line);position:relative;flex:none;border:0;padding:0;margin:0;cursor:pointer;transition:background .15s}
.sw input:after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--knob-ring,transparent);transition:transform .15s}
.sw input:checked{background:var(--acc)}.sw input:checked:after{transform:translateX(16px)}
.sw input:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ph .act .sw{margin:0 6px 0 0}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0 0 14px}
.choice label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--field-line);border-radius:10px;cursor:pointer;background:var(--panel)}
.choice label:has(input:checked){border-color:var(--acc);background:var(--acc-soft)}
.choice input{width:16px;height:16px;padding:0;margin:2px 0 0;border:0;box-shadow:none;accent-color:var(--acc);flex:none}
.choice input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.choice span{min-width:0;overflow-wrap:anywhere}
.choice b{display:block;font-size:13.5px;font-weight:600}.choice small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
button{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:var(--acc);color:var(--acc-ink);font:600 13px var(--sans);cursor:pointer;white-space:nowrap;transition:filter .15s,background .15s}
button:hover{filter:brightness(1.08)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.ghost{background:transparent;color:var(--fg);border-color:var(--field-line)}button.ghost:hover{background:var(--panel2);filter:none}
button.danger{background:var(--bad);color:var(--bad-ink)}
button.icon{width:34px;padding:0;justify-content:center}button.sm{height:28px;padding:0 10px;font-size:12.5px}
button.wr{white-space:normal;height:auto;min-height:34px;padding-top:6px;padding-bottom:6px;text-align:left}
button:disabled{opacity:.5;cursor:default}
.inline{display:flex;gap:8px;align-items:center}.inline>input{flex:1;min-width:0}
.f2{display:grid;grid-template-columns:1fr 110px;gap:12px}
.f2.eq{grid-template-columns:1fr 1fr}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:0 12px}
input[type=range]{height:24px;padding:0;border:0;background:none;box-shadow:none;accent-color:var(--acc)}
.snd{display:flex;align-items:center;gap:8px;margin:0 0 8px}.snd .sw{flex:1;margin:0;min-width:0}

/* pills, tables, lists */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;white-space:nowrap;padding:0 9px;border-radius:999px;font:600 11px var(--sans);letter-spacing:.02em;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.pill.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding:0 10px 8px;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:hover td{background:var(--panel2)}
td.mono{font-family:var(--mono);font-size:12.5px}
td.empty{color:var(--mut);text-align:center;padding:18px;white-space:normal}
/* on a phone: the decks are a stacked row each, the model and its In Companion pill, then serial · fw · USB;
   the signal chain's links go one under the other (step 8) */
.dsub,.dm .pill{display:none}.mtc{display:inline-flex;align-items:center;gap:8px}td.dm{white-space:normal;min-width:140px}
@media (max-width:600px){.dtab thead{display:none}.dtab tr{display:block;padding:9px 10px;border-top:1px solid var(--line)}.dtab tr:first-child{border-top:0;padding-top:0}
  .dtab td{display:none;padding:0;border:0}.dtab td.dm{display:flex;align-items:center;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;white-space:normal}
  .dtab .dm .pill{display:inline-flex}.dtab td.dsub{display:block;margin-top:3px;color:var(--mut);font-size:12px;white-space:normal;overflow-wrap:anywhere}
  .dtab td.empty{display:block;padding:8px 0}.dtab td.dmt{display:block;margin-top:8px}.dtab td.dmt:empty{display:none}
  .chain{grid-template-columns:minmax(0,1fr)}.hop+.hop{border-left:0;border-top:1px solid var(--line)}.hop+.hop:before{left:24px;top:-6px;margin-top:0;transform:rotate(135deg)}
  .sg small,.sg .bars{display:none}}
::placeholder{color:var(--dim)}
.hint{background:var(--panel2);border:1px dashed var(--field-line);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--mut);margin-top:12px}
.plist{list-style:none;margin:0;padding:0}.plist li{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0}.plist li:first-child{margin-top:0}
.plist .ic{color:var(--warn);margin-top:2px}
.dock{padding:14px 0;border-top:1px solid var(--line)}.dock:first-child{padding-top:0;border-top:0}.dock:last-child{padding-bottom:0}
.dockh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.addto{margin-top:6px;font-size:13px;color:var(--mut);overflow-wrap:anywhere}.addto b{color:var(--fg);font-weight:600}

/* banners, progress, log, toast */
.bn{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;padding:10px 14px;border-radius:10px;font-weight:500;line-height:1.45}
.bn>span:not(.spin){min-width:0;overflow-wrap:anywhere}
.bn.warn{background:var(--warn-soft);color:var(--warn)}.bn.bad{background:var(--bad-soft);color:var(--bad)}.bn.ok{background:var(--ok-soft);color:var(--ok)}.bn.acc{background:var(--acc-soft);color:var(--acc)}
.bn .ic{margin-top:2px}.bn button{margin-left:auto;flex:none}.bn button+button{margin-left:0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 12px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
pre{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font:12px/1.55 var(--mono);max-height:64vh;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mut)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:70;display:none;align-items:center;gap:10px;max-width:min(460px,calc(100vw - 32px));padding:11px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 12px 32px rgba(0,0,0,.35);font-weight:500;color:var(--fg)}
#toast .ic{color:var(--ok)}#toast.bad .ic{color:var(--bad)}
.skel{height:96px;border-radius:12px;background:linear-gradient(90deg,var(--panel) 0,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.spin,.skel{animation:none}}

/* dialogs */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,6,10,.55)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.modal>.scrim{position:absolute;z-index:0}
.modal .box{position:relative;z-index:1;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.45)}
.modal .mh{display:flex;gap:12px;align-items:center;padding:18px 18px 8px}
.modal .mi{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--warn-soft);color:var(--warn)}
.modal.danger .mi{background:var(--bad-soft);color:var(--bad)}
.modal.info .mi{background:var(--acc-soft);color:var(--acc)}
.modal h3{margin:0;font-size:15.5px;font-weight:600;text-wrap:balance;overflow-wrap:anywhere}
.modal .mb{padding:0 18px 4px 68px;color:var(--mut);font-size:13.5px}
.modal .mb p{margin:6px 0}.modal .mb b{color:var(--fg);font-weight:600}.modal .mb code{color:var(--fg)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;margin-top:14px;border-top:1px solid var(--line);background:var(--panel2)}
.lgerr{color:var(--bad);min-height:1.3em;margin:8px 0 0;font-weight:500}
@media (max-width:480px){.modal .mb{padding-left:18px}.f2{grid-template-columns:1fr 90px}.f2.eq{grid-template-columns:1fr}}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s,visibility .2s;visibility:hidden}
  #side.open{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.4);transition:transform .2s}   /* visible at once, so focus can move in */
  #scrim.open{display:block;position:fixed;inset:0;z-index:20;background:rgba(3,6,10,.55)}
  #menu{display:inline-flex}
  header.top{padding:10px 16px;flex-wrap:wrap}
  header.top h1{flex:1;min-width:0;white-space:normal}
  .chips{order:1;width:100%;justify-content:flex-start;margin-left:0}
  .wrap{padding:16px 16px 40px}
}
/* fingers: bigger targets */
@media (pointer:coarse){button,button.sm{height:40px}button.wr{min-height:40px}button.icon{width:40px}nav a{padding:10px}.sw{min-height:40px;margin:0 0 4px}}

</div>

<script>
'use strict';
/* The box's setup page. Everything from the box or the network (names, decks, Companion hosts, log text, error
   messages) reaches the page through textContent / attribute setters only (h() below), never as
   markup. */
const $=s=>document.querySelector(s), V=()=>$('#view');
const AP_IP='192.168.4.1', DOCK_PORT=5343;
const HINT="Stream Deck Mini or Pedal not showing up on a hub? Plug it straight into the box's USB port.";
let ws=null, rid=1, pend={}, S={sys:null,at:0,key:''}, INFO={}, page='home', PG={}, RS=false, loginP=null, TOK='', OK=0, BACK=false;

/* ---------- DOM building (data only ever becomes text nodes or attribute values) ---------- */
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in attrs||{}){const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':String(v))}
  add(e,kids);return e}
function add(e,kids){for(const c of [kids].flat(Infinity))if(c!=null&&c!==false)e.append(c instanceof Node?c:String(c));return e}
function fill(e,...kids){if(e){e.replaceChildren();add(e,kids)}return e}
/* fn redraws el: a button focused in it before is focused again after, found by its data-k, id or label (a live redraw
   never drops focus to the page, audit P2-B) */
const fkey=b=>b.dataset.k||b.id||b.textContent;
function keepFocus(el,fn){const a=document.activeElement,k=el&&a&&el.contains(a)&&fkey(a);fn();
  if(k)for(const b of el.querySelectorAll('button'))if(k===fkey(b)&&!b.disabled){b.focus();break}}
function ic(n,c=''){const NS='http://www.w3.org/2000/svg',s=document.createElementNS(NS,'svg'),u=document.createElementNS(NS,'use');
  s.setAttribute('class','ic'+(c?' '+c:''));s.setAttribute('aria-hidden','true');u.setAttribute('href','#i-'+n);s.append(u);return s}
const panel=(title,body,act,icon,id)=>h('section',{class:'panel',id},h('div',{class:'ph'},h('h2',null,icon&&ic(icon,'sm'),title),act&&h('div',{class:'act'},act)),h('div',{class:'pb'},body));
const kv=rows=>h('dl',{class:'kv'},rows.filter(Boolean).map(([k,v])=>[h('dt',null,k),h('dd',null,v)]));
const pill=(cls,t)=>h('span',{class:'pill '+(cls||'')},t);
const dot=cls=>h('span',{class:'dot '+(cls||'')});
const P=(...k)=>h('p',null,...k), B=t=>h('b',null,t), C=t=>h('code',null,t);
const NUM={inputmode:'numeric',pattern:'[0-9]*',maxlength:8},pinOk=p=>/^\d{4,8}$/.test(p);   // a PIN: the phone's number pad
function fld(id,label,val,type='text',attrs={}){const i=h('input',Object.assign({id,type},attrs));i.value=val??'';return h('label',{class:'f'},h('span',null,label),i)}
function chk(id,label,on){const i=h('input',{id,type:'checkbox'});i.checked=!!on;return h('label',{class:'sw'},i,label)}
function pick(id,label,opts,val){const s=h('select',{id},opts.map(([v,t])=>h('option',{value:v},t)));s.value=String(val);return h('label',{class:'f'},h('span',null,label),s)}   // opts: [value, text]
/* a password field with Show / Hide */
function pfld(id,label,val,attrs){const i=h('input',Object.assign({id,type:'password',spellcheck:'false',maxlength:63},attrs));i.value=val||'';
  const b=btn('Show',()=>{const s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Hide':'Show'},'ghost',null,{'aria-controls':id});
  return h('label',{class:'f'},h('span',null,label),h('div',{class:'inline'},i,b))}
/* a field's error under it (aria-invalid, aria-describedby) and the field focused; false, for return bad(...).
   It goes when the field is edited. */
function bad(id,m){const i=$('#'+id);if(!i){toast(m,true);return false}let e=$('#'+id+'-e');if(!e){e=h('small',{class:'ferr',id:id+'-e'});(i.closest('label')||i.parentNode).append(e)}
  e.textContent=m;i.setAttribute('aria-invalid','true');i.setAttribute('aria-describedby',id+'-e');i.focus();return false}
/* Save rows: Save stays off until a field of its panel differs from what was loaded or last saved, "Unsaved changes" beside it */
const fv=p=>[...p.querySelectorAll('input:not([type=file]),select,textarea')].map(e=>e.type==='radio'?e.checked?e.value:'':e.type==='checkbox'?e.checked:e.value).join('\n');
/* r._x: the panel was kept over a change on the box (show()): 2 says so beside Save, 1 (it was saving) doesn't; once it is
   clean again (saved, or put back) the page is drawn again */
function dirt(){for(const r of V().querySelectorAll('.sv')){const v=fv(r.closest('.panel'));if(r._s==null)r._s=v;r._d=v!==r._s;r.firstChild.disabled=!r._d||!!r.firstChild._busy;r.lastChild.hidden=!r._d;
  if(r._x&&!r._d){r._x=0;queue(PG,'cfg',redraw)}r.lastChild.textContent=r._x===2?'Unsaved changes. Also changed elsewhere: Save keeps yours.':'Unsaved changes'}}
const dirty=()=>[...V().querySelectorAll('.sv')].some(r=>r._d);
/* a few options as cards: opts [[value, title, description]]; radio(name) reads the choice */
function choice(name,val,opts,label){return h('div',{class:'choice',role:'radiogroup','aria-label':label},opts.map(([v,t,d,n])=>{const i=h('input',{type:'radio',name,value:v});i.checked=v===val;
  return h('label',null,i,h('span',null,h('b',null,n&&[ic(n),' '],t),d&&h('small',null,d)))}))}
const radio=name=>{const e=document.querySelector(`input[name="${name}"]:checked`);return e?e.value:''};
const btn=(label,onclick,cls,icon,attrs)=>h('button',Object.assign({type:'button',class:cls||null,onclick},attrs),icon&&ic(icon,'sm'),label);
/* a button that stays disabled while its action runs */
const act=fn=>async e=>{const b=e.currentTarget;b.disabled=true;b._busy=1;try{await fn()}catch(_){}finally{b._busy=0;b.disabled=false;dirt();
  if(b.isConnected&&document.activeElement===document.body&&!$('#app').inert)b.focus()}};   // a dialog closed while it was disabled
const gv=id=>{const e=$('#'+id);return e.type==='checkbox'?e.checked:e.value};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const plural=(n,one,many)=>`${n} ${n===1?one:many}`;
const bytes=s=>new TextEncoder().encode(s).length;   // the box counts UTF-8 bytes, not characters
function fmtUp(s){s=Math.max(0,Math.floor(s||0));const d=Math.floor(s/86400),hr=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d?`${d} d ${hr} h`:hr?`${hr} h ${m} m`:m?`${m} m`:`${s} s`}
const shortVer=v=>String(v||'').split('+')[0];
const KEYS={boxName:'Box name',companionHost:'Address',companionPort:'Port',ethIp:'IP address',ethMask:'Subnet mask',ethGw:'Gateway',ethDns:'DNS',wifiSsid:'Network name',wifiPass:'Password',wifiBackupSsid:'Backup network name',wifiBackupPass:'Backup password',apPass:'Hotspot password',
  speakerVolume:'Volume',ledPin:'Data pin',ledBrightness:'Brightness'};
function errText(e){let m=String((e&&e.message)||e||'failed');const k=/^(\w+): /.exec(m);if(k&&KEYS[k[1]])m=KEYS[k[1]]+': '+m.slice(k[0].length);
  if(m==='Failed to fetch'||m==='Load failed'||m==='NetworkError when attempting to fetch resource.')m='the box is not reachable';
  return m.charAt(0).toUpperCase()+m.slice(1)}

/* ---------- theme, toast ---------- */
function applyTheme(t){if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
  const dark=t?t==='dark':!matchMedia('(prefers-color-scheme: light)').matches;fill($('#themebtn'),ic(dark?'sun':'moon','sm'))}
function toggleTheme(){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');const t=cur==='dark'?'light':'dark';
  try{localStorage.setItem('theme',t)}catch(_){}applyTheme(t)}
try{applyTheme(localStorage.getItem('theme'))}catch(_){applyTheme(null)}
function toast(m,bad){const t=$('#toast');t.className=bad?'bad':'';fill(t,ic(bad?'warning':'check-circle'),h('span',null,m));t.style.display='flex';
  clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none'},bad?6500:3800)}

/* ---------- JSON-RPC: WebSocket /rpc, HTTP POST /rpc when it is down ---------- */
/* With a settings password every call carries the session token ("token" in the frame, Bearer on
   plain requests). A 401 opens the sign-in dialog once and retries the call. */
try{TOK=sessionStorage.getItem('tok')||localStorage.getItem('tok')||''}catch(_){}
function setTok(t,remember){TOK=t||'';try{sessionStorage.removeItem('tok');localStorage.removeItem('tok');if(t)(remember?localStorage:sessionStorage).setItem('tok',t)}catch(_){}}
const authHdr=x=>Object.assign(x||{},TOK?{Authorization:'Bearer '+TOK}:{});
function wsSignIn(){if(TOK&&ws&&ws.readyState===1)ws.send(JSON.stringify({id:rid++,method:'Auth.GetStatus',token:TOK}))}   // the socket gets pushes
function wsOpen(){
  try{ws=new WebSocket(`ws://${location.host}/rpc`)}catch(_){ws=null;setTimeout(wsOpen,3000);return}
  ws.onopen=()=>{wsSignIn();renderChips();if(INFO.id)catchUp()};   // a reconnect: catch up on what changed meanwhile
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.id&&pend[m.id]){const p=pend[m.id];delete pend[m.id];p(m)}
    else if(m.method==='NotifyStatus'&&m.params&&m.params.sys)onSys(m.params.sys)};
  ws.onclose=()=>{ws=null;for(const k in pend){const p=pend[k];delete pend[k];p({error:{code:-1,message:'connection lost'}})}
    renderChips();setTimeout(wsOpen,3000)};
}
function post(f,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  return fetch('rpc',{method:'POST',headers:authHdr({'Content-Type':'application/json'}),body:JSON.stringify(f),signal:c.signal})
    .then(async r=>{const m=await r.json().catch(()=>({}));if(!r.ok&&!m.error)throw {message:m.message||'HTTP '+r.status};return m})
    .catch(e=>{throw e&&e.name==='AbortError'?{message:'no answer from the box'}:e}).finally(()=>clearTimeout(t))}
/* opt: {http: plain HTTP only, timeout: ms} */
function rpc(method,params,opt={}){
  const f={id:rid++,src:'webui',method,params:params||{}};if(TOK)f.token=TOK;
  const ms=opt.timeout||20000;
  const done=m=>{if(!m.error)return m.result;
    if(m.error.code===401&&!opt.retried&&!/^Auth\./i.test(method))
      return login().then(ok=>{if(ok)return rpc(method,params,Object.assign({},opt,{retried:true}));throw m.error});
    throw m.error};
  if(!opt.http&&ws&&ws.readyState===1){ws.send(JSON.stringify(f));
    return new Promise(res=>{pend[f.id]=res;setTimeout(()=>{if(pend[f.id]){delete pend[f.id];res({error:{code:-1,message:'no answer from the box'}})}},ms)}).then(done)}
  return post(f,ms).then(done);
}
/* every action's call: a toast for errors (and okMsg for success) */
async function call(method,params,okMsg){try{const r=await rpc(method,params);OK++;if(okMsg)toast(okMsg);return r}catch(e){toast(errText(e),true);throw e}}

/* ---------- sign-in ---------- */
/* Only when the 401 was about this browser's session: a wrong current password in Device.SetAuth
   is a 401 as well, and needs no dialog. */
function login(){
  return loginP||(loginP=(async()=>{let st={};try{st=await rpc('Auth.GetStatus')}catch(_){}
    if(!st.auth_en||st.authed)return false;
    if(TOK){setTok('');$('#outbtn').hidden=true}   // the box doesn't know this token: it restarted, or the password changed
    return loginDialog(st)})().finally(()=>{loginP=null}));
}
function loginDialog(st){return new Promise(res=>{
  const el=$('#loginm'),err=h('p',{class:'lgerr',role:'alert'}),pw=h('input',Object.assign({id:'lgp',type:'password',autocomplete:'current-password',required:true},st.pin===false?{}:NUM));
  const keep=h('input',{id:'lgk',type:'checkbox'}),go=h('button',{type:'submit',id:'lgb'},ic('key','sm'),'Sign in');
  let timer=null;const close=()=>{clearInterval(timer);el.hidden=true;el.replaceChildren();modalClosed()};
  /* the box refuses for a while after wrong passwords ("try again in N s"): count it down */
  const wait=s=>{clearInterval(timer);let left=s;const tick=()=>{if(left<=0){clearInterval(timer);go.disabled=false;err.textContent='';return}
      go.disabled=true;err.textContent=`Too many wrong tries. Try again in ${left} s.`;left--};tick();timer=setInterval(tick,1000)};
  const form=h('form',{onsubmit:async e=>{e.preventDefault();go.disabled=true;err.textContent='';
    try{const t=await rpc('Auth.Login',{password:pw.value});setTok(t.token,keep.checked);close();
      $('#outbtn').hidden=false;wsSignIn();res(true)}
    catch(x){if(/^no (PIN|password) is set$/.test(x.message)){close();res(true);return}   // removed meanwhile, from another browser
      const m=/try again in (\d+) s/.exec(x.message||'');pw.value='';pw.focus();
      if(m)wait(Number(m[1]));else{go.disabled=false;err.textContent=/^wrong (PIN|password)$/.test(x.message)?'Wrong '+x.message.slice(6)+'.':errText(x)}}}},
    h('div',{class:'mb'},h('label',{class:'f'},h('span',null,st.pin===false?'Settings password':'Settings PIN'),pw),h('label',{class:'sw'},keep,'Keep me signed in on this browser'),err),
    h('div',{class:'mf'},go));
  fill(el,h('div',{class:'scrim'}),h('div',{class:'box',role:'dialog','aria-modal':'true','aria-labelledby':'lgt'},
    h('div',{class:'mh'},h('div',{class:'mi'},ic('key')),h('h3',{id:'lgt'},'Sign in to '+(INFO.name||(S.sys&&S.sys.name)||'the box'))),form));
  modalOpen();el.hidden=false;pw.focus();if(st.locked_s)wait(st.locked_s);
})}
async function signOut(){try{if(TOK)await rpc('Auth.Logout',{token:TOK})}catch(_){}setTok('');location.reload()}

/* ---------- dialogs ---------- */
/* While a dialog is open the page behind it is inert (Tab stays in the dialog); focus then goes
   back to what opened it. */
let modalRes=null,modalFrom=null;
function modalOpen(){if(!$('#app').inert)modalFrom=document.activeElement;$('#app').inert=true}
function modalClosed(){if(!$('#modal').hidden||!$('#loginm').hidden)return;$('#app').inert=false;
  const f=modalFrom;modalFrom=null;if(f&&f.isConnected&&!f.disabled)f.focus()}
function confirmAction({title,body,ok='Continue',no:nt='Cancel',kind='warn',icon='warning'}){
  return new Promise(res=>{const m=$('#modal');m.className='modal '+kind;
    const no=btn(nt,()=>closeModal(false),'ghost'),yes=btn(ok,()=>closeModal(true),kind==='danger'?'danger':'');
    fill(m,h('div',{class:'scrim',onclick:()=>closeModal(false)}),h('div',{class:'box'},h('div',{class:'mh'},h('div',{class:'mi'},ic(icon)),h('h3',{id:'mtitle'},title)),
      h('div',{class:'mb'},body),h('div',{class:'mf'},no,yes)));
    modalOpen();m.hidden=false;modalRes=res;no.focus()})}
function closeModal(v){const m=$('#modal');if(m.hidden)return;m.hidden=true;m.replaceChildren();modalClosed();const r=modalRes;modalRes=null;if(r)r(v)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalRes)closeModal(false);else setDrawer(false)}});

/* ---------- restarts: a banner, then wait until the box answers again ---------- */
function banner(kind,msg,spin){const b=$('#rsbn');clearTimeout(b._h);if(!msg){b.hidden=true;b.replaceChildren();return}
  b.className='bn '+kind;b.hidden=false;fill(b,spin?h('span',{class:'spin'}):ic(kind==='ok'?'check-circle':'warning'),h('span',null,msg))}
/* act: what restarts the box (null when it is already on its way) */
async function restartFlow(act,msg){
  /* restarted = the uptime is behind what it would be by now without a restart (a missed poll
     alone proves nothing) */
  const b0=S.sys?{up:S.sys.uptime_s,at:S.at}:null;let gone=false,st=null;RS=true;
  const fw=(S.sys||{}).firmware||{};   // new firmware checking itself: the restart waits for the check
  if(fw.pending_verify)msg+=` It waits for the firmware's self-check first${fw.check_at_s>boxUp()?` (in ${clock(fw.check_at_s-boxUp())})`:''}.`;
  const back=st=>b0?st.uptime_s<b0.up+(Date.now()-b0.at)/1000-3:gone;
  banner('acc',msg,true);
  if(act){try{await act()}catch(e){RS=false;banner();toast('The restart did not start: '+errText(e),true);return false}}
  const t0=Date.now(),wait=120000+(fw.pending_verify&&fw.rollback_at_s?Math.max(0,fw.rollback_at_s-boxUp())*1000:0);   // the restart waits for the check
  while(Date.now()-t0<wait){
    await sleep(1500);
    try{st=await rpc('Sys.GetStatus',{},{http:true,timeout:4000});if(st&&back(st))break;st=null}
    catch(_){if(!gone){gone=true;banner('acc','Restarting. The box is offline for a few seconds; this page reconnects by itself.',true)}}
  }
  if(!st){RS=false;banner('bad',`The box isn't back after ${Math.round(wait/60000)} minutes. It may have a new address, or it is still starting: this page keeps trying by itself.`);return false}
  onSys(st);RS=false;   // after onSys: it would take the uptime drop for a restart of its own
  try{await loadInfo()}catch(_){}
  banner('ok','The box is back.');$('#rsbn')._h=setTimeout(()=>banner(),5000);
  go();return true;
}

/* ---------- status ---------- */
/* Sys.GetStatus, pushed as NotifyStatus whenever it changes, and polled every 10 s as a safety
   net. Pages redraw only their live parts (LIVE[page]); forms are never redrawn. */
const LIVE={};
const statusKey=s=>JSON.stringify(Object.assign({},s,{uptime_s:0,heap:0,message:Object.assign({},s.message,{remaining_s:0})}));
function onSys(s){
  if(!s||typeof s!=='object')return;
  const prev=S.sys;S.sys=s;S.at=Date.now();
  const k=statusKey(s),changed=k!==S.key;S.key=k;
  const up=$('#uptime');if(up)up.textContent=fmtUp(s.uptime_s);
  if(prev&&s.uptime_s+5<prev.uptime_s&&!RS){restarted();return}   // restarted by someone else
  renderBrand();renderChips();
  if(changed&&LIVE[page])LIVE[page]();
  if(page==='device')renderMsg();
  syncRev();
}
async function refreshStatus(){if(document.hidden||RS)return;try{onSys(await rpc('Sys.GetStatus'))}catch(_){renderChips()}}
async function restarted(){try{await loadInfo()}catch(_){}renderChips();
  if(REV.cfg[page]&&PG.drawn){PG.rev={};if(LIVE[page])LIVE[page]();syncRev()}   // a settings page: read it all again (rev starts at 0 again), panel by panel
  else if(!editing())go();else if(LIVE[page])LIVE[page]()}
async function catchUp(){try{await loadInfo()}catch(_){}refreshStatus()}
function editing(){const a=document.activeElement;return !!a&&V().contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(checkbox|radio|button|submit|file)$/.test(a.type)}
/* Sys.GetStatus.rev: what changed on the box since the page was drawn. cfg counts the settings saved (here, in another
   browser, on a deck), found and slots fingerprint the Companions found and the firmware slots; the page reads again
   only what changed, for the page shown (REV[part][page]), one read at a time per part. */
const REVK=['cfg','found','slots'];
const revDiff=(o,n)=>!o||!n?[]:REVK.filter(k=>o[k]!==n[k]);
const REV={cfg:{},found:{companion:async pg=>{if((S.sys||{}).mode==='dock')return;const l=await rpc('Companion.List');
  if(pg===PG&&JSON.stringify(l)!==JSON.stringify(pg.list)){pg.list=l;renderCList()}}},slots:{firmware:pg=>pollSlots(pg)}};
for(const k of ['companion','ethernet','wifi','ap','device','feedback'])REV.cfg[k]=redraw;
function syncRev(){const pg=PG,n=(S.sys||{}).rev;if(!pg.drawn)return;
  for(const k of revDiff(pg.rev,n)){pg.rev[k]=n[k];if(k==='cfg')loadInfo().catch(()=>{});const f=REV[k][page];if(f)queue(pg,k,f)}}
/* a change meanwhile reads once more after; a failed read is tried again at the next status */
async function queue(pg,k,f){const q=pg.q||(pg.q={});if(q[k]){q[k]=2;return}
  try{do{q[k]=1;await f(pg)}while(q[k]===2&&pg===PG)}catch(_){if(pg.rev)pg.rev[k]=null}finally{q[k]=0}}
/* the page drawn again from the box's settings; show() keeps what is being edited */
async function redraw(pg){if(pg!==PG||!pg.drawn)return;await PAGES[page](pg);if(pg===PG){if(LIVE[page])LIVE[page]();dirt()}}
async function loadInfo(){INFO=await rpc('Device.GetInfo');$('#outbtn').hidden=!(INFO.auth_en&&TOK);$('#fwver').textContent='fw '+(INFO.version||'—');$('#devid').textContent=INFO.id||'';renderBrand()}
function renderBrand(){const n=(S.sys&&S.sys.name)||INFO.name||'Companion Box';$('#devname').textContent=n;document.title=n+' · Companion Box'}

/* Dock mode with no deck plugged in: no dock's port is open, so there is nothing to add yet. */
const NODECK='Plug in a Stream Deck: each deck appears in Companion as its own surface (port 5343 for the first).';
/* What the Companion page says when it lists no dock. */
function docksEmpty(s){
  if((s.net||{}).route==='none')return 'No network yet: connect Ethernet or Wi-Fi. '+NODECK;
  if(!(s.dock||[]).length)return 'The Network Docks are not running: see the recent problems on Home.';
  return NODECK;
}

/* What the box is doing, in one word for chips, tiles and banners. */
function conn(s){
  const n=s.net||{},c=s.companion||{};
  if(n.route==='none')return {k:'nonet',cls:'bad',chip:'No network',tile:'No network'};
  if(s.mode==='dock'&&!(s.decks||[]).length)return {k:'nodeck',cls:'warn',chip:'No deck',tile:'No deck'};
  if(s.mode==='dock'){const k=(s.dock||[]).filter(d=>d.companion).length;
    return k?{k:'dock',cls:'ok',chip:'Companion connected',tile:'Connected'}:{k:'dockwait',cls:'warn',chip:'Waiting for Companion',tile:'Waiting'}}

/* ---------- Home ---------- */
/* The signal chain: Network → Companion → Decks, each link with its state (dot), one word, one line and, when
   broken, its one fix; the banner text of a broken link (why). The first broken link gets the page's one banner; all
   three good is Ready. */
function chain(s,ap){   // ap: this page came over the hotspot (no uplink there: setting up, the network link in accent)
  const n=s.net||{},c=s.companion||{},decks=(s.decks||[]).filter(d=>!d.ignored),docks=s.dock||[],dock=s.mode==='dock',on=n.route!=='none';
  const L=(icon,name,cls,word,sub,fix,why)=>({icon,name,cls,word,sub,fix:fix||null,why:why||null});
  const net=on?L('network','Network','ok',n.route==='eth'?'Ethernet':'Wi-Fi',[n.route==='wifi'&&n.sta_ssid,n.ip].filter(Boolean).join(' · '))
    :L('network','Network',ap?'acc':'bad','Offline',(n.eth_link?'':'Ethernet cable not connected. ')+(n.wifi_connected?'':'Wi-Fi is not connected.'),
      null,'No network. The box is running its setup hotspot only.');   // its fixes: the banner's
  let comp;
  const C=(...a)=>L('companion','Companion',...a);
  if(!on)comp=C('','Waiting','needs the network');
  else if(dock){const k=docks.filter(d=>d.companion);
    comp=!decks.length?C('','Waiting','waits for a deck')   // no port is open, nothing to add yet
      :k.length?C('ok','Connected',k[0].peer?'from '+k[0].peer:plural(k.length,'dock','docks')+' in use')
      :C('warn','Waiting','add the box in Companion',['Show how','companion'],'Network Dock mode: add the box in Companion under Surfaces → Remote.')}
  else if(c.state==='connected')comp=C('ok','Connected',hostPort(c)+(c.version?' · '+shortVer(c.version):''));
  else if(c.state==='too_old')comp=C('bad','Too old',`${shortVer(c.version)} at ${hostPort(c)}`,null,
    'Companion is older than 5.0, so the box refuses to connect. Update Companion; the box checks again every 30 seconds.');
  else if(c.selection==='ambiguous')comp=C('warn','Choose',`${c.instances} found`,['Choose one','companion'],
    "More than one Companion answers. The box won't pick one by itself.");
  else comp=C('warn','Looking',c.auto?'not found yet':'trying '+hostPort(c),['Find Companion','companion'],c.auto
    ?"The box is on the network but hasn't found Companion yet. Companion 5.0+ announces itself; on another subnet, enter its address."
    :'No answer from Companion yet: check its address and that it runs.');
  const inC=d=>!!drives(s,d);
  const m=decks.filter(inC).length,nd=plural(decks.length,'deck','decks'),D=(...a)=>L('keys','Decks',...a);
  const ig=s.decksIgnored,lim=s.deckLimit||2,room=decks.length<lim,xd=(s.decks||[]).find(d=>d.ignored);   // a deck over the limit, ignored until unplugged
  const dk=ig?D('warn',nd,plural(ig,'deck','decks')+' over the limit',!room&&lim<4&&['Open Device','device'],room   // room again, still ignored
      ?`${xd?xd.model:'A deck'} is over the limit: unplug it and plug it back in.`:`Deck limit reached (${lim}). Unplug one${lim<4?', or allow up to 4 on Device':''}.`)
    :!on?D('',decks.length?nd:'No deck',decks.length?'wait for the network':'none plugged in')   // not yet
    :!decks.length?D('warn','No deck','none plugged in',null,dock?NODECK:"No Stream Deck connected. Plug one into the box's USB port.")
    :m===decks.length?D('ok',nd,`${m} of ${m} in Companion`)
    :m||comp.cls==='ok'?D('warn',nd,`${m} of ${decks.length} in Companion`,dock&&['Show how','companion'],
      `${plural(decks.length-m,'deck is','decks are')} not in Companion yet: add each dock in Companion under Surfaces → Remote.`)
    :D('',nd,'not in Companion yet');
  const links=[net,comp,dk];
  return {links,first:links.find(l=>/bad|warn|acc/.test(l.cls))||null,ready:links.every(l=>l.cls==='ok'),sum:`${nd} in Companion over ${net.word}`};
}

  const c=PG.cfg,off=!p.apEnabled&&c.apEnabled,rejoin=p.apSecured!==!!c.apSecured||p.apSecured&&p.apPass!==c.apPass;
  if(via()==='ap'&&(off||rejoin)&&!await confirmAction({title:'Change the hotspot?',ok:'Save',
    body:P('This page reaches the box through its hotspot. ',off?'Turning it off disconnects this device.'
      :p.apSecured?'Join the hotspot again with the new password.':'Join the hotspot again: it is open now, with no password.')}))return;
  await call('Ap.SetConfig',p,'Saved. Applied without a restart.');Object.assign(c,p);LIVE.ap();
}

/* ---------- Firmware ---------- */
LIVE.firmware=()=>{const s=S.sys||{},fw=s.firmware||{},c6=s.c6||{};if(!$('#fwst'))return;
  fill($('#fwst'),kv([['Running',fw.version||INFO.version],
    ['Wi-Fi chip',c6.running?['ESP-Hosted '+c6.running,c6.carried&&c6.carried!==c6.running?pill('warn','box carries '+c6.carried):pill('ok','Up to date')]:pill('bad','not answering')]]));
  fill($('#fwpv'),fw.pending_verify?h('div',{class:'bn warn'},ic('warning'),h('span',{id:'fwpvt'},pvText(fw,boxUp()))):null)};
/* The OTA self-check's countdown. firmware.check_at_s (the next check) and rollback_at_s (the check that goes back to the
   previous firmware if they keep failing) are the box's uptime seconds; check_failed, what the last check found. up: the
   box's uptime now, as this page reckons it (the last status's, and the time since). */
const clock=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const boxUp=()=>S.sys?S.sys.uptime_s+(Date.now()-S.at)/1000:0;
function pvText(fw,up){
  if(!fw.check_at_s)return 'This firmware is new and still checking itself (about 30 seconds after start). Uploading works once that is done.';
  const next=fw.check_at_s-up,when=next>0?'in '+clock(next):'now';
  if(!fw.check_failed)return next>0?`This firmware is new: it checks itself in ${clock(next)}. Uploading works once it has passed; a restart asked for now waits for it.`
    :'This firmware is new and is checking itself now…';
  return `The firmware's last self-check found: ${fw.check_failed}. `+(fw.rollback_at_s<=fw.check_at_s
    ?`The next check (${when}) is the last: if it fails too, the box goes back to the previous firmware.`
    :`Next check ${when}. If the checks still fail in ${clock(fw.rollback_at_s-up)}, the box goes back to the previous firmware.`)}
/* the recovery slot: both app slots and Ota.GetStatus.sync */
const SYNC={in_sync:['ok','In sync',"The other slot holds a copy of this firmware: if this slot's image gets damaged, the box starts the copy. (A fault in the firmware itself isn't covered: the copy is the same firmware.)"],
  syncing:['','Syncing','Copying this firmware into the other slot. The box works on as usual.'],
  differs:['warn','Differs','The other slot holds an older firmware. The box replaces it with a copy of this one.'],
  other_newer:['warn','Other slot newer',"The other slot holds a firmware built at the same time as this one or later (written over USB?). The box never overwrites it by itself: boot it, or sync to replace it."],
  empty:['warn','Empty','The other slot holds no firmware. The box puts a copy of this one there.'],
  invalid:['bad','Invalid','The other slot holds a firmware that failed (an update that went back). The box replaces it with a copy of this one.'],
  waiting:['','Waiting','The box makes the copy 10 minutes after start, not while new firmware checks itself or an upload runs, and an hour after a failed try.']};
/* another project's firmware: replaced by the sync, never booted from here */
function slotsView(o){const y=o.sync||{},x=y.other||{},fw=(S.sys||{}).firmware||{},sy=y.state==='syncing',pct=(y.pct||0)+' %';
  const foreign=!!x.foreign||(!!x.project&&!!fw.project&&x.project!==fw.project),[cls,label,note]=foreign?['bad',x.project?'Other project':'Unknown firmware',
    `The other slot holds ${x.project?`another project's firmware (${x.project})`:'a firmware without an app descriptor (another or unknown project)'}. It can't be started from here; the box replaces it with a copy of this one.`]:SYNC[y.state]||SYNC.waiting;
  const boot=!!x.valid&&!foreign&&!o.pending_verify&&!sy;
  return [kv([[(o.running||'?')+' (running)',[o.version||INFO.version||'—',fw.build&&h('span',{class:'dim'},fw.build)]],
      [x.label||'Other slot',x.version?[foreign&&x.project,x.version,h('span',{class:'dim'},x.date+' '+x.time)]:'—'],
      ['Recovery copy',[pill(cls,label),sy&&pct]]]),
    sy&&h('div',{class:'bar'},h('i',{style:'width:'+pct.replace(' ','')})),h('p',{class:'note'},note),
    h('div',{class:'btns'},btn('Sync now',act(syncNow),'','floppy-disk',{disabled:sy}),btn('Boot other slot',act(bootOther),'ghost','play',{disabled:!boot}))]}
function renderSlots(){const e=$('#slots'),o=PG.ota;if(!e||!o)return;const fw=(S.sys||{}).firmware||{};   // all slotsView reads
  const k=JSON.stringify([o.sync,o.running,o.version,o.pending_verify,fw.build,fw.project,INFO.version]);
  if(k!==PG.sk){PG.sk=k;fill(e,slotsView(o))}}
/* the slots read again: when they change on the box (rev.slots, the copy's progress too), after Sync now */
async function pollSlots(pg){const n=pg.ps=(pg.ps||0)+1;const o=await rpc('Ota.GetStatus');if(pg===PG&&n===pg.ps){pg.ota=o;renderSlots()}}
async function syncNow(){const y=(PG.ota||{}).sync||{},x=y.other||{},force=y.state==='other_newer';
  if(force&&!await confirmAction({title:'Replace the newer firmware?',kind:'danger',ok:'Replace it',body:[
    P(B(x.label),` holds ${x.version||'a firmware'}, built ${x.date} ${x.time}: newer than the running one.`),P('Sync overwrites it with a copy of the running firmware.')]}))return;
  await call('Ota.Sync',force?{force}:{},'Sync started.');pollSlots(PG).catch(()=>{})}
async function bootOther(){const x=((PG.ota||{}).sync||{}).other||{};
  if(await confirmAction({title:'Boot the other slot?',icon:'play',ok:'Boot and restart',body:[P('The box restarts into ',B(x.label),` (${x.version||'?'}), a few seconds offline.`),
    P("It checks itself like an update: if it doesn't start properly, the box goes back to this firmware.")]}))
    await restartFlow(()=>rpc('Ota.BootOther'),'Restarting into the other slot…')}
function fwMsg(kind,msg){fill($('#fwmsg'),msg?h('div',{class:'bn '+kind},ic(kind==='ok'?'check-circle':kind==='acc'?'info':'warning'),h('span',null,msg)):null)}
async function upload(){
  const f=$('#fw').files[0];if(!f)return;
  const o=PG.ota||{};
  if(!await confirmAction({title:'Install new firmware?',icon:'cloud-arrow-down',kind:'info',ok:'Upload and restart',body:[
    P(B(f.name),` (${(f.size/1048576).toFixed(2)} MB) is written to the spare slot${o.next?' ('+o.next+')':''}; the running firmware stays untouched until the new one is complete and checked.`),
    P("Then the box restarts into it, a few seconds offline. If the new firmware doesn't start properly, the box goes back to the previous one by itself.")]}))return;
  /* signed in first (rpc signs in on a 401): one refused halfway through the image only shows a dropped connection;
     and not while another upload is being written */
  let st;try{st=await rpc('Ota.GetStatus')}catch(e){fwMsg('bad','Upload not started: '+errText(e));return}
  if(st&&st.state==='writing'){fwMsg('warn','Another firmware upload is being written. Try again once it is done.');return}
  const bar=$('#fwprog'),fillb=bar.firstChild;bar.hidden=false;fillb.style.width='0';fwMsg('acc','Uploading… 0%');
  const r=await new Promise(res=>{const x=new XMLHttpRequest();x.open('POST','ota');if(TOK)x.setRequestHeader('Authorization','Bearer '+TOK);
    x.setRequestHeader('Content-Type','application/octet-stream');
    x.upload.onprogress=e=>{if(!e.lengthComputable)return;const p=Math.round(e.loaded*100/e.total);fillb.style.width=p+'%';fwMsg('acc',p<100?`Uploading… ${p}%`:'Checking the image…')};
    x.onload=()=>{let m={};try{m=JSON.parse(x.responseText)}catch(_){}res({status:x.status,m})};
    x.onerror=()=>res({status:0,m:{message:'the connection dropped during the upload'}});x.send(f)});
  if(r.status===200){fillb.style.width='100%';fwMsg('ok',`Firmware ${r.m.version||''} installed. The box restarts into it.`);
    return restartFlow(null,`Installing firmware ${r.m.version||''}. The box restarts…`)}
  bar.hidden=true;
  if(r.status===401){fwMsg('warn','Sign in, then upload again.');return login()}
  const why=(r.status?'Upload refused: ':'Upload failed: ')+errText(r.m.message||('HTTP '+r.status));fwMsg('bad',why);toast(why,true);
}
async function restartBox(){
  if(await confirmAction({title:'Restart the box?',icon:'arrow-clockwise',ok:'Restart now',body:P('The decks go dark for about 5 seconds; this page reconnects by itself.')}))
    await restartFlow(()=>rpc('Device.Restart'),'Restarting. The box is back in a few seconds…');
}

/* ---------- Device ---------- */
async function saveDevice(){
  const pg=PG,a=pg.auth,name=gv('bname').trim(),pw=gv('pwnew'),old=a.auth_en?gv('pwold'):'';
  if(!name)return bad('bname','Enter a box name');
  if(bytes(name)>32)return bad('bname',NAME32);
  /* one typo here locks the user out: the new password twice, then a warning */
  if(pw!==gv('pwrep')){$('#pwnew').value=$('#pwrep').value='';return bad('pwnew','The two PINs differ. Type the new one in both fields again.')}
  if(pw){
    if(!pinOk(pw))return bad('pwnew','4 to 8 digits');
    if(a.auth_en&&!old)return bad('pwold','Enter the current '+(a.pin?'PIN':'password')+' first');
    if(!await confirmAction({title:a.auth_en?'Change the settings PIN?':'Set a settings PIN?',icon:'key',kind:'info',ok:a.auth_en?'Change PIN':'Set PIN',body:[
      P(a.auth_en?'Every other browser is signed out and needs the new PIN.':'This page then asks for it before it shows or changes anything, and the decks ask for it before their locked keys work.'),
      P(B('Keep it somewhere safe.'),' Without it, nobody can sign in here, and the factory reset on this page is locked as well. The only way back is the service button (GPIO32): hold it for 10 seconds for a factory reset, which erases every setting.')]}))return;
  }
  let did=false;const u={},ad=gv('cadopt');
  if(name!==pg.cfg.boxName)u.boxName=name;
  if(ad!==(pg.cfg.companionAdopt!==false))u.companionAdopt=ad;
  if(Object.keys(u).length){await call('Device.SetConfig',u);Object.assign(pg.cfg,u);did=true;if(u.boxName)loadInfo().catch(()=>{})}
  if(pw){const p={pass:pw};if(a.auth_en)p.old_pass=old;
    let keep=false;try{keep=!!localStorage.getItem('tok')}catch(_){}   // "keep me signed in" stays as it was
    const r=await call('Device.SetAuth',p);setTok(r.token,keep);wsSignIn();INFO.auth_en=true;$('#outbtn').hidden=false;
    for(const i of ['pwold','pwnew','pwrep']){const e=$('#'+i);if(e)e.value=''}   // the panel drawn again once the box says (rev.cfg)
    toast(a.auth_en?'Saved. The PIN is changed; other browsers sign in again.':'Saved. The settings PIN is on.');refreshStatus();return}
  if(!did){for(const i of ['pwold','pwnew','pwrep']){const e=$('#'+i);if(e)e.value=''}OK++}   // nothing to save leaves it clean (no #pwold without a PIN)
  toast(did?'Saved.':'Nothing to save.');
}
/* the box menu gesture: two different corners (the first tapped), the taps, the hold; it applies at once */
const CN=['topLeft','topRight','bottomLeft','bottomRight'],CNR=['Top left','Top right','Bottom left','Bottom right'].map((t,i)=>[i,t]);
async function saveGesture(){const a=+gv('gk1'),b=+gv('gk2');if(a===b)return bad('gk2','Pick another key');
  await call('Device.SetConfig',{gestureEnabled:gv('gon'),gestureKeys:[CN[a],CN[b]],gestureTaps:+gv('gtaps'),gestureHoldSeconds:+gv('ghold')},'Saved.')}
async function removePass(){
  const pg=PG,old=gv('pwold'),w=(pg.auth||{}).pin?'PIN':'password';if(!old)return bad('pwold',`Enter the current ${w} first`);
  if(!await confirmAction({title:`Remove the settings ${w}?`,body:P('Anyone on the network can then open this page and change the settings.'),ok:'Remove it'}))return;
  await call('Device.SetAuth',{pass:null,old_pass:old},w==='PIN'?'PIN removed.':'Password removed.');setTok('');INFO.auth_en=false;$('#outbtn').hidden=true;
  const o=pg===PG&&$('#pwold');if(o){o.value='';const r=o.closest('.panel').querySelector('.sv');if(r)r._s=null}   // clean: drawn again without the PIN
  refreshStatus();
}
function renderMsg(){const el=$('#msgst');if(!el)return;const m=(S.sys||{}).message||{};
  if(!m.active){el.textContent='No message on the decks.';return}
  const left=Math.max(0,Math.round(m.remaining_s-(Date.now()-S.at)/1000));
  el.textContent=`On the decks now: “${m.text.replace(/\n/g,' / ')}”`+(m.remaining_s?`, ${left} s left.`:', until you clear it.');
  if(m.remaining_s&&left===0&&!PG.msgPoll){PG.msgPoll=true;setTimeout(()=>{PG.msgPoll=false;refreshStatus()},1200)}}
async function showMsg(){
  const text=gv('msgtext'),sec=Number(gv('msgsec'));
  if(!/^[\x20-\x7e\n]{1,160}$/.test(text)||!text.trim())return bad('msgtext','1-160 plain characters (letters, digits, punctuation; no accents or emoji)');
  if(!Number.isInteger(sec)||sec<0||sec>3600)return bad('msgsec','A whole number 0-3600');
  const m=await call('Deck.ShowMessage',{text,seconds:sec},'Shown on the decks.');
  if(S.sys){S.sys.message=m;S.at=Date.now()}renderMsg();
}
/* The box menu on the decks: each deck with a screen has its own, opened and closed from its row on
   Home; it takes that deck away from Companion until it is closed (or 60 s without a press), so it asks first when
   Companion drives that deck. The banner names the decks it is open on and closes them all. */
const drives=(s,d)=>{if(d.ignored)return null;if(s.mode==='dock'){const k=(s.dock||[]).find(x=>x.serial===d.serial);return k&&k.companion?k:null}
  return (s.companion||{}).state==='connected'};
const mtBanner=o=>h('div',{class:'bn acc bw'},ic('keys'),h('span',null,o.length>1?`Box menu open on ${o.length} decks. Companion gets each deck back when you close its menu.`
    :`Box menu open on ${o[0].model}. Companion gets the deck back when you close it.`),
  btn(o.length>1?'Close all':'Close menu',act(()=>mtToggle(false)),'ghost',null,{'data-k':'mtall'}));
const mtCell=d=>d.menu?[pill('acc','Box menu'),btn('Close menu',act(()=>mtToggle(false,d)),'ghost sm',null,{'data-k':'mt'+d.serial,'aria-label':'Close the box menu on '+d.model})]
  :btn('Show box menu',act(()=>mtToggle(true,d)),'ghost sm',null,{'data-k':'mt'+d.serial,'aria-label':'Show the box menu on '+d.model});
async function mtToggle(on,d){const s=S.sys||{};   // d: that deck's row; none: every deck (the banner)
  if(on&&drives(s,d)&&!await confirmAction({title:`Show the box menu on ${d.model}?`,ok:'Show the box menu',icon:'keys',
    body:[P('Companion loses ',B(d.model),' until you close the menu, or after 60 s without a press: its keys show the box menu instead.')]}))return;
  await call('Deck.ShowMaintenance',d?{on,serial:d.serial}:{on});await refreshStatus();
  const b=$(`[data-k="mt${d?d.serial:'all'}"]`)||$('#decks button');   // redrawn: focus on its new self (the banner gone: a deck's button)
  if(b&&document.activeElement===document.body&&!$('#app').inert)b.focus()}
async function clearMsg(){const m=await call('Deck.ClearMessage',{},'Cleared.');if(S.sys){S.sys.message=m;S.at=Date.now()}renderMsg()}
/* the deck limit, 2 (what the box's PoE is sized for) or 4 at the user's risk; it restarts the box */
async function setDecks(n){
  if(!await confirmAction(n===4?{title:'Allow up to 4 Stream Decks?',kind:'danger',ok:'Allow 4 and restart',no:'Keep 2',body:[
    P('The box powers its USB port from Power over Ethernet, which is sized for 2 Stream Decks. With more, the decks can drop out or the box can restart. A powered USB hub gives the extra decks their own power.'),
    P(B('You enable this at your own risk.'),' The box restarts.')]}
    :{title:'Back to 2 Stream Decks?',icon:'arrow-clockwise',ok:'Use 2 and restart',body:[P(B('The box restarts.'),' A third or fourth deck is then ignored.')]}))return;
  const r=await call('Device.SetConfig',{deckLimit:n});
  if(r&&r.restarting)return restartFlow(null,`Up to ${n} Stream Decks. The box restarts…`);
  toast('Saved');go()}
async function factoryReset(){$('#rstc').hidden=true;await restartFlow(()=>rpc('Device.FactoryReset'),'Factory reset. Restarting with default settings…')}

/* ---------- Speaker & LED ---------- */
const LIGHT=[['#fff','White, fast blink','Find my box'],['#a0f','Purple, fast blink','Firmware update'],['#f04','Red and purple','Deck problem'],
  ['#f00','Red, slow blink','No network'],['#08f','Blue, slow blink','Setup hotspot'],['#fa0','Amber, slow blink','No Companion'],['#0c4','Green','Connected'],['#aaa','White, dim','Starting']];

/* the speaker field of a Feedback.Test / Device.Identify answer as words: null when it works; "starting"
   (the codec still coming up after a start) is no fault */

/* ---------- Logs ---------- */
/* log text into pg.lines (colour codes out, the last 150-200 KB kept), each line with its time on this computer's
   clock: the box stamps a line with its log clock ("I (12345) tag: …", ms since it started) and Log.Get's up_ms is
   that clock as the text was read, so the line was written (up_ms - stamp) ms before it arrived (mod 2^32: the
   clock wraps after 49 days). Lines without a stamp (a message's further lines) get none. An unfinished last line
   waits in pg.tail for the rest. */
function logAppend(pg,text,up){if(!text)return;const now=Date.now(),
    parts=(pg.tail+text.replace(/\x1b\[[0-9;]*m/g,'')).split('\n');
  pg.tail=parts.pop();if(pg.tail.length>4096){parts.push(pg.tail);pg.tail=''}
  for(const s of parts){const m=/^[EWIDV] \((\d+)\) /.exec(s);
    pg.lines.push({t:m&&typeof up==='number'?now-((up-Number(m[1]))>>>0):null,s});pg.len+=s.length+1}
  if(pg.len>200000){let k=0;while(pg.len>150000&&k<pg.lines.length)pg.len-=pg.lines[k++].s.length+1;pg.lines.splice(0,k)}
  logShow(pg)}
const logTime=t=>{const d=new Date(t),p=(x,n=2)=>String(x).padStart(n,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(),3)}`};
/* the log as shown: with timestamps on, each line after its local time (HH:MM:SS.mmm; blanks of that width without one) */
function logText(pg){const pad=pg.ts?' '.repeat(13):'',
    f=l=>pg.ts?(l.t==null?pad:logTime(l.t)+' ')+l.s:l.s;
  return pg.lines.map(f).join('\n')+(pg.lines.length?'\n':'')+(pg.tail?pad+pg.tail:'')}
/* the view follows the log while it is scrolled to the end, and otherwise keeps its place */
function logShow(pg){const pre=$('#log');if(!pre)return;const atEnd=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-20,top=pre.scrollTop;
  pre.textContent=logText(pg);pre.scrollTop=atEnd?pre.scrollHeight:top}
async function pollLog(pg){
  if(pg!==PG)return;
  if(!document.hidden)try{const r=await rpc('Log.Get',{since:pg.seq});if(pg!==PG)return;pg.seq=r.seq;logAppend(pg,r.text,r.up_ms)}catch(_){}
  pg.timer=setTimeout(()=>pollLog(pg),1000);
}
/* "Export .log": the log shown, as <box name>-<YYYY-MM-DD-HHMMSS>.log (local time), the name made safe for a file */
const logName=(n,d)=>{const p=x=>String(x).padStart(2,'0');
  return (String(n||'').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')||'companion-box')+
    `-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.log`};
/* "Copy": the log shown onto the clipboard. The box serves plain http, where navigator.clipboard is missing (it needs
   a secure context), so the old way stands in: a hidden textarea, selected and copied. */
async function copyLog(){const t=($('#log')||{}).textContent||'';if(!t)return toast('Nothing to copy yet',true);
  let ok=false;
  if(navigator.clipboard&&window.isSecureContext)try{await navigator.clipboard.writeText(t);ok=true}catch(_){}
  if(!ok){const a=document.activeElement,ta=h('textarea',{readonly:true,'aria-hidden':'true',style:'position:fixed;top:0;left:-9999px;opacity:0'});
    ta.value=t;document.body.append(ta);ta.select();try{ok=document.execCommand('copy')}catch(_){}ta.remove();if(a&&a.focus)a.focus()}
  toast(ok?'Log copied':'Copying failed: select the text, or use Export .log',!ok)}
function exportLog(){const t=($('#log')||{}).textContent||'';if(!t)return toast('Nothing to export yet',true);
  const a=document.createElement('a');a.download=logName((S.sys&&S.sys.name)||INFO.name,new Date());
  a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

/* ---------- start ---------- */
wsOpen();
setTimeout(async()=>{try{await loadInfo()}catch(_){}await refreshStatus();go()},300);
setInterval(refreshStatus,10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshStatus()});
